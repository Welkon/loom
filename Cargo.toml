[package]
name = "loom"
version = "0.16.0"
license = "AGPL-3.0-or-later"
edition = "2024"
publish = false
description = "Pinned embedded drivers and algorithms"

[[bin]]
name = "loom"
path = "src/bin/loom.rs"

[dependencies]
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
